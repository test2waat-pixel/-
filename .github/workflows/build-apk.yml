name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          set -e
          APP_DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "App folder: $APP_DIR"
          cd "$APP_DIR"

          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capgo/capacitor-contacts

          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            printf '{"appId":"com.daftarhisabat.app","appName":"Daftar","webDir":"dist"}' > capacitor.config.json
          fi

          npm run build
          npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          cd ..
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: daftar-alhisabat-apk
          path: out/app-debug.apk
