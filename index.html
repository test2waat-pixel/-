<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>دفتر الحسابات — تصميم فراس المحمود</title>
    <meta name="description" content="تطبيق متقدم لإدارة الحسابات والديون مع دعم الوضع الليلي وتعدد اللغات والنسخ الاحتياطي." />
    <meta property="og:title" content="دفتر الحسابات — تصميم فراس المحمود" />
    <meta property="og:description" content="تطبيق متقدم لإدارة الحسابات والديون مع دعم الوضع الليلي وتعدد اللغات والنسخ الاحتياطي." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="دفترالحسابات" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-sans: 'Cairo', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

        --bg-canvas: #f8fafc;
        --bg-header: rgba(255, 255, 255, 0.88);
        --bg-surface: #ffffff;
        --bg-subtle: #f1f5f9;
        --bg-input: #f8fafc;
        --bg-dark-card: #0f172a;
        --bg-dark-card-inner: rgba(255, 255, 255, 0.05);

        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;

        --border-hairline: #e2e8f0;
        --border-strong: #cbd5e1;

        --accent-primary: #0f172a;
        --accent-primary-hover: #1e293b;
        --accent-emerald: #059669;
        --accent-emerald-hover: #047857;
        --accent-rose: #e11d48;
        --accent-rose-hover: #be123c;
        --accent-amber: #d97706;

        --tint-given-bg: rgba(255, 241, 242, 0.8);
        --tint-given-border: rgba(254, 205, 211, 0.9);
        --tint-taken-bg: rgba(236, 253, 245, 0.8);
        --tint-taken-border: rgba(167, 243, 208, 0.9);
        --tint-amber-bg: #fffbeb;
        --tint-amber-border: #fde68a;
        --tint-amber-text: #92400e;

        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
        --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
        --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.14);
        --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.24);
      }

      html.dark {
        --bg-canvas: #020617;
        --bg-header: rgba(2, 6, 23, 0.88);
        --bg-surface: #0f172a;
        --bg-subtle: #1e293b;
        --bg-input: #020617;
        --bg-dark-card: #0f172a;
        --bg-dark-card-inner: rgba(255, 255, 255, 0.04);

        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;

        --border-hairline: #1e293b;
        --border-strong: #334155;

        --accent-primary: #059669;
        --accent-primary-hover: #10b981;

        --tint-given-bg: rgba(76, 5, 25, 0.32);
        --tint-given-border: rgba(136, 19, 55, 0.6);
        --tint-taken-bg: rgba(2, 44, 34, 0.34);
        --tint-taken-border: rgba(6, 78, 59, 0.6);
        --tint-amber-bg: rgba(69, 26, 3, 0.45);
        --tint-amber-border: rgba(180, 83, 9, 0.65);
        --tint-amber-text: #fcd34d;

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.45);
        --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.6);
      }

      html[lang="en"],
      html[lang="fr"],
      html[lang="tr"] {
        --font-sans: 'Plus Jakarta Sans', 'Cairo', system-ui, -apple-system, sans-serif;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: var(--font-sans);
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      button, input, textarea {
        font-family: inherit;
      }

      .hidden {
        display: none !important;
      }

      .font-num {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Top Header */
      .app-header {
        position: sticky;
        top: 0;
        z-index: 30;
        height: 64px;
        background: var(--bg-header);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-hairline);
      }

      .header-inner {
        max-width: 1120px;
        height: 100%;
        margin: 0 auto;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .header-inner.narrow {
        max-width: 896px;
      }

      .header-inner.calc-width {
        max-width: 768px;
      }

      .icon-btn {
        min-width: 44px;
        min-height: 44px;
        border: none;
        border-radius: 12px;
        background: transparent;
        color: var(--text-primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.15s ease;
        flex-shrink: 0;
      }

      .icon-btn:hover {
        background: var(--bg-subtle);
      }

      .icon-btn:active {
        transform: scale(0.95);
      }

      .icon-btn.danger {
        color: var(--accent-rose);
      }

      .icon-btn.danger:hover {
        background: var(--tint-given-bg);
      }

      .header-title-wrap {
        min-width: 0;
        flex: 1;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .header-title {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 220px;
      }

      .header-subtitle {
        margin: 0;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 220px;
      }

      .logo-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        padding: 0;
        border: 1px solid var(--border-hairline);
        background: var(--bg-subtle);
        color: var(--text-secondary);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
      }

      .logo-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Page Containers */
      .main-grid {
        max-width: 1120px;
        width: 100%;
        margin: 0 auto;
        padding: 20px 16px 112px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: start;
      }

      .profile-grid {
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
        padding: 20px 16px 48px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: start;
      }

      .settings-grid {
        max-width: 896px;
        width: 100%;
        margin: 0 auto;
        padding: 24px 16px 56px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        align-items: start;
      }

      .calc-container {
        max-width: 768px;
        width: 100%;
        margin: 0 auto;
        padding: 16px 16px 36px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      @media (min-width: 960px) {
        .header-inner {
          padding: 0 24px;
        }
        .main-grid {
          padding: 24px 24px 100px;
          grid-template-columns: 5fr 7fr;
        }
        .profile-grid {
          padding: 24px 24px 56px;
          grid-template-columns: 5fr 7fr;
        }
        .settings-grid {
          padding: 24px 24px 56px;
          grid-template-columns: 1fr 1fr;
        }
        .sticky-col {
          position: sticky;
          top: 84px;
        }
      }

      .stack-col {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Cards */
      .surface-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: 24px;
        padding: 20px;
        box-shadow: var(--shadow-sm);
      }

      /* Totals Card */
      .totals-card {
        position: relative;
        overflow: hidden;
        border-radius: 24px;
        background: var(--bg-dark-card);
        color: #ffffff;
        padding: 22px;
        border: 1px solid #1e293b;
        box-shadow: var(--shadow-lg);
      }

      .totals-glow-1,
      .totals-glow-2 {
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        filter: blur(55px);
        pointer-events: none;
      }

      .totals-glow-1 {
        top: -80px;
        inset-inline-end: -60px;
        background: rgba(16, 185, 129, 0.14);
      }

      .totals-glow-2 {
        bottom: -90px;
        inset-inline-start: -60px;
        background: rgba(244, 63, 94, 0.14);
      }

      .totals-inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .totals-net-head {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
      }

      .totals-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        color: #94a3b8;
      }

      .totals-net-amount {
        font-size: clamp(28px, 5vw, 38px);
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      .totals-net-state {
        font-size: 12px;
        font-weight: 600;
        color: #cbd5e1;
      }

      .totals-divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
      }

      .totals-split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .totals-box {
        border-radius: 16px;
        background: var(--bg-dark-card-inner);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .totals-box-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
      }

      .totals-box-val {
        font-size: 19px;
        font-weight: 800;
      }

      .text-rose { color: #fb7185; }
      .text-emerald { color: #34d399; }
      .text-rose-ink { color: #e11d48; }
      .text-emerald-ink { color: #059669; }
      html.dark .text-rose-ink { color: #fb7185; }
      html.dark .text-emerald-ink { color: #34d399; }

      /* Search & Filters */
      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .input-wrap {
        position: relative;
        flex: 1;
      }

      .input-icon-start {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        inset-inline-start: 14px;
        color: var(--text-muted);
        pointer-events: none;
        display: flex;
      }

      .input-clear-end {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        inset-inline-end: 6px;
        min-width: 36px;
        min-height: 36px;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .text-input,
      .textarea-input {
        width: 100%;
        border-radius: 16px;
        border: 1px solid var(--border-hairline);
        background: var(--bg-surface);
        color: var(--text-primary);
        font-size: 14px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .text-input {
        height: 48px;
        padding: 0 14px;
      }

      .text-input.with-start-icon {
        padding-inline-start: 42px;
      }

      .text-input.with-both-icons {
        padding-inline-start: 42px;
        padding-inline-end: 42px;
      }

      .textarea-input {
        padding: 12px 14px;
        resize: vertical;
        min-height: 88px;
        line-height: 1.55;
      }

      .text-input:focus,
      .textarea-input:focus {
        outline: none;
        border-color: var(--accent-emerald);
        box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
      }

      .dice-btn {
        min-width: 48px;
        min-height: 48px;
        padding: 0 14px;
        border-radius: 16px;
        border: 1px solid var(--border-hairline);
        background: var(--bg-surface);
        color: var(--text-primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s ease;
        flex-shrink: 0;
      }

      .dice-btn.active {
        background: var(--accent-primary);
        border-color: var(--accent-primary);
        color: #ffffff;
      }

      .filter-panel {
        border-radius: 18px;
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        padding: 16px;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .filter-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .filter-title {
        margin: 0;
        font-size: 14px;
        font-weight: 800;
      }

      .filter-label {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 6px;
        display: block;
      }

      .segmented-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 4px;
        border-radius: 12px;
        background: var(--bg-subtle);
      }

      .seg-btn {
        min-height: 40px;
        padding: 0 8px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s ease;
      }

      .seg-btn.active {
        background: var(--bg-surface);
        color: var(--text-primary);
        box-shadow: var(--shadow-sm);
      }

      .chip-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip-btn {
        min-height: 40px;
        padding: 0 12px;
        border-radius: 12px;
        border: 1px solid var(--border-hairline);
        background: var(--bg-input);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s ease;
      }

      .chip-btn.active {
        background: var(--accent-primary);
        border-color: var(--accent-primary);
        color: #ffffff;
      }

      .overdue-toggle-btn {
        width: 100%;
        min-height: 50px;
        padding: 10px 14px;
        border-radius: 14px;
        border: 1px solid var(--border-hairline);
        background: var(--bg-input);
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        text-align: start;
        cursor: pointer;
      }

      .overdue-toggle-btn.active {
        background: var(--tint-amber-bg);
        border-color: var(--tint-amber-border);
        color: var(--tint-amber-text);
      }

      .switch-track {
        width: 44px;
        height: 26px;
        border-radius: 999px;
        padding: 3px;
        background: var(--border-strong);
        display: flex;
        align-items: center;
        justify-content: flex-start;
        flex-shrink: 0;
        transition: background-color 0.15s ease;
      }

      .switch-track.on {
        background: var(--accent-emerald);
        justify-content: flex-end;
      }

      .overdue-toggle-btn.active .switch-track.on {
        background: var(--accent-amber);
      }

      .switch-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: var(--shadow-sm);
      }

      /* Customer List & Cards */
      .list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4px;
      }

      .list-title {
        margin: 0;
        font-size: 14px;
        font-weight: 800;
      }

      .list-count {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
      }

      .cards-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .customer-card {
        width: 100%;
        min-height: 74px;
        padding: 16px;
        border-radius: 18px;
        border: 1px solid var(--border-hairline);
        background: var(--bg-surface);
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        text-align: start;
        cursor: pointer;
        transition: border-color 0.15s ease, transform 0.12s ease;
      }

      .customer-card:hover {
        border-color: var(--border-strong);
      }

      .customer-card:active {
        transform: scale(0.99);
      }

      .customer-main {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .customer-name {
        font-size: 16px;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .customer-meta {
        font-size: 12px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .overdue-text {
        font-weight: 700;
        color: var(--accent-amber);
      }

      .customer-balance-col {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
      }

      .customer-balance-val {
        font-size: 17px;
        font-weight: 800;
      }

      .customer-balance-tag {
        font-size: 12px;
        font-weight: 700;
      }

      .empty-card {
        border-radius: 24px;
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        padding: 40px 24px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .empty-icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--bg-subtle);
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Floating Action Button (FAB) on the left */
      .fab-btn {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 30;
        min-height: 52px;
        padding: 0 20px;
        border: none;
        border-radius: 16px;
        background: var(--accent-primary);
        color: #ffffff;
        font-size: 14px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: var(--shadow-lg);
        cursor: pointer;
        transition: transform 0.15s ease, background-color 0.15s ease;
      }

      .fab-btn:hover {
        background: var(--accent-primary-hover);
      }

      .fab-btn:active {
        transform: scale(0.96);
      }

      /* Buttons */
      .btn {
        min-height: 48px;
        padding: 0 16px;
        border-radius: 16px;
        border: 1px solid transparent;
        font-size: 14px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.12s ease, background-color 0.15s ease;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn-sm {
        min-height: 40px;
        padding: 0 14px;
        border-radius: 12px;
        font-size: 12px;
      }

      .btn-primary {
        background: var(--accent-primary);
        color: #ffffff;
      }

      .btn-primary:hover {
        background: var(--accent-primary-hover);
      }

      .btn-secondary {
        background: var(--bg-subtle);
        color: var(--text-primary);
      }

      .btn-outline {
        background: var(--bg-surface);
        border-color: var(--border-hairline);
        color: var(--text-primary);
      }

      .btn-rose {
        background: var(--accent-rose);
        color: #ffffff;
      }

      .btn-rose:hover {
        background: var(--accent-rose-hover);
      }

      .btn-emerald {
        background: var(--accent-emerald);
        color: #ffffff;
      }

      .btn-emerald:hover {
        background: var(--accent-emerald-hover);
      }

      .btn-whatsapp {
        background: #128C7E;
        color: #ffffff;
      }

      .btn-whatsapp:hover {
        background: #0f766a;
      }

      .btn-amber-soft {
        background: var(--tint-amber-bg);
        border-color: var(--tint-amber-border);
        color: var(--tint-amber-text);
      }

      .btn-danger-soft {
        background: var(--tint-given-bg);
        color: var(--accent-rose);
      }

      /* Transaction Cards */
      .tx-card {
        user-select: none;
        -webkit-user-select: none;
        border-radius: 16px;
        padding: 16px;
        border: 1px solid var(--border-hairline);
        box-shadow: var(--shadow-sm);
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .tx-card.given {
        background: var(--tint-given-bg);
        border-color: var(--tint-given-border);
      }

      .tx-card.taken {
        background: var(--tint-taken-bg);
        border-color: var(--tint-taken-border);
      }

      .tx-card.pressing {
        transform: scale(0.975);
        opacity: 0.78;
      }

      .tx-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .tx-info {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .tx-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12px;
      }

      .tx-note {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        word-break: break-word;
      }

      .tx-amount {
        font-size: 18px;
        font-weight: 800;
        flex-shrink: 0;
      }

      /* Calculator */
      .calc-display {
        border-radius: 24px;
        background: #0f172a;
        color: #ffffff;
        padding: 20px;
        border: 1px solid #1e293b;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .calc-expr-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 36px;
      }

      .calc-expr {
        font-size: 14px;
        color: #94a3b8;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .calc-mini-btn {
        min-width: 40px;
        min-height: 36px;
        padding: 0 12px;
        border: none;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.12);
        color: #f8fafc;
        font-size: 12px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .calc-result {
        font-size: clamp(34px, 7vw, 48px);
        font-weight: 800;
        text-align: end;
        line-height: 1.1;
      }

      .calc-keypad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        direction: ltr;
        user-select: none;
      }

      .calc-key {
        min-height: 58px;
        border-radius: 16px;
        border: 1px solid var(--border-hairline);
        background: var(--bg-surface);
        color: var(--text-primary);
        font-size: 20px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.1s ease, background-color 0.12s ease;
      }

      .calc-key:active {
        transform: scale(0.95);
      }

      .calc-key.op {
        background: var(--bg-subtle);
        border-color: transparent;
        color: var(--accent-emerald);
      }

      .calc-key.eq {
        background: var(--accent-primary);
        border-color: transparent;
        color: #ffffff;
      }

      /* Modals */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 0;
      }

      .modal-backdrop.center {
        align-items: center;
        padding: 16px;
      }

      .modal-sheet {
        width: 100%;
        max-width: 448px;
        border-radius: 24px 24px 0 0;
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        padding: 24px;
        box-shadow: var(--shadow-xl);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .modal-dialog {
        width: 100%;
        max-width: 384px;
        border-radius: 24px;
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        padding: 24px;
        box-shadow: var(--shadow-xl);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      @media (min-width: 640px) {
        .modal-backdrop {
          align-items: center;
          padding: 16px;
        }
        .modal-sheet {
          border-radius: 24px;
        }
      }

      .grab-bar {
        width: 40px;
        height: 5px;
        border-radius: 999px;
        background: var(--border-strong);
        margin: -8px auto 0;
      }

      @media (min-width: 640px) {
        .grab-bar { display: none; }
      }

      /* Banner & Toast */
      .reminder-banner {
        border-radius: 18px;
        background: var(--tint-amber-bg);
        border: 1px solid var(--tint-amber-border);
        color: var(--tint-amber-text);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .install-banner {
        border-radius: 18px;
        background: var(--tint-taken-bg);
        border: 1px solid var(--tint-taken-border);
        color: var(--text-primary);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .offline-strip {
        border-radius: 14px;
        background: var(--bg-subtle);
        border: 1px solid var(--border-hairline);
        color: var(--text-secondary);
        padding: 10px 14px;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .toast {
        position: fixed;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 60;
        padding: 10px 18px;
        border-radius: 14px;
        background: #0f172a;
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: var(--shadow-lg);
        white-space: nowrap;
      }

      .divider-line {
        height: 1px;
        background: var(--border-hairline);
      }

      .preview-box {
        border-radius: 14px;
        background: var(--bg-subtle);
        padding: 12px;
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.6;
        white-space: pre-line;
      }

      .logo-preview {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 1px solid var(--border-hairline);
        background: var(--bg-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
      }

      .logo-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }

        function loadJson(key, fallback) {

        function hasNativeContactsPicker() {
          return (
            'contacts' in navigator &&
            'ContactsManager' in window &&
            typeof navigator.contacts.select === 'function'
          );
        }

        function getEffectiveContactsPermission() {
          if (pwa.browserContactsPermission === 'denied') return 'denied';
          return state.settings.contactsPermission || 'prompt';
        }

        function syncBrowserContactsPermission() {
          if (navigator.permissions && typeof navigator.permissions.query === 'function') {
            navigator.permissions.query({ name: 'contacts' }).then((status) => {
              if (status && status.state) {
                pwa.browserContactsPermission = status.state;
                if (status.state === 'denied') {
                  state.settings.contactsPermission = 'denied';
                  persistSettings();
                } else if (status.state === 'granted' && state.settings.contactsPermission !== 'denied') {
                  state.settings.contactsPermission = 'granted';
                  persistSettings();
                }
              }
            }).catch(() => {});
          }
        }

        syncBrowserContactsPermission();

        if (navigator.contacts && typeof navigator.contacts.getProperties === 'function') {
          navigator.contacts.getProperties().then((props) => {
            if (Array.isArray(props) && props.length > 0) {
              const wanted = ['name', 'tel'].filter((p) => props.includes(p));
              if (wanted.length > 0) pwa.supportedContactProps = wanted;
            }
          }).catch(() => {});

        async function triggerPWAInstall() {
          if (!pwa.deferredPrompt) return false;
          try {
            await pwa.deferredPrompt.prompt();
            const choice = await pwa.deferredPrompt.userChoice;
            if (choice && choice.outcome === 'accepted') {
              pwa.isInstalled = true;
              pwa.deferredPrompt = null;
              render();
              return true;
            }
          } catch (_) {}
          return false;

        // ============================================================

        // ============================================================
        function t() {
          return TRANSLATIONS[state.settings.language] || TRANSLATIONS.ar;
        }

        function isRtl() {
          return state.settings.language === 'ar';
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function generateId() {
          if (window.crypto && typeof window.crypto.randomUUID === 'function') {
            return window.crypto.randomUUID();
          }
          return Date.now() + '-' + Math.random().toString(36).slice(2, 9);
        }

        function formatCurrency(amount) {
          const absVal = Math.abs(amount);
          const lang = state.settings.language;
          const locale = lang === 'tr' ? 'tr-TR' : lang === 'fr' ? 'fr-FR' : 'en-US';
          const hasDecimals = Math.round(absVal * 100) % 100 !== 0;
          return new Intl.NumberFormat(locale, {
            minimumFractionDigits: hasDecimals ? 2 : 0,
            maximumFractionDigits: 2,
          }).format(absVal);
        }

        function formatPhoneWithCountryCode(rawPhone, defaultCode) {
          const trimmed = String(rawPhone || '').trim();
          if (!trimmed) return '';
          let cleaned = trimmed.replace(/[^\d+]/g, '');
          if (!cleaned) return '';
          const normDef = defaultCode.startsWith('+') ? defaultCode : '+' + defaultCode.replace(/\D/g, '');
          if (cleaned.startsWith('00')) cleaned = '+' + cleaned.slice(2);
          if (!cleaned.startsWith('+')) {
            cleaned = normDef + cleaned.replace(/^0+/, '');
          }
          const digits = cleaned.slice(1);
          if (digits.length <= 4) return '+' + digits;
          const ccLen = digits.startsWith('1') ? 1 : /^(90|20|33|49|44)/.test(digits) ? 2 : 3;
          const cc = digits.slice(0, ccLen);
          const rest = digits.slice(ccLen);
          const groups = (rest.match(/.{1,3}/g) || [rest]).join(' ');
          return ('+' + cc + ' ' + groups).trim();
        }

        function formatRelativeTime(timestamp) {
          const tr = t();
          if (!timestamp) return tr.noTransactionsYet;
          const diffMs = Math.max(0, state.nowTick - timestamp);
          const mins = Math.floor(diffMs / 60000);
          if (mins < 1) return tr.justNow;
          if (mins < 60) return tr.minutesAgo.replace('{n}', String(mins));
          const hours = Math.floor(mins / 60);
          if (hours < 24) return tr.hoursAgo.replace('{n}', String(hours));
          const days = Math.floor(hours / 24);
          if (days < 30) return tr.daysAgo.replace('{n}', String(days));
          return tr.monthsAgo.replace('{n}', String(Math.floor(days / 30)));
        }

        function formatDateTimeDisplay(isoOrMs) {
          const d = typeof isoOrMs === 'number' ? new Date(isoOrMs) : new Date(isoOrMs);
          if (isNaN(d.getTime())) return '';
          const lang = state.settings.language;
          const locale = lang === 'ar' ? 'ar-SA' : lang === 'tr' ? 'tr-TR' : lang === 'fr' ? 'fr-FR' : 'en-US';
          return new Intl.DateTimeFormat(locale, {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
          }).format(d);
        }

        function toLocalDateTimeInput(date) {
          const d = date || new Date();
          const pad = (n) => String(n).padStart(2, '0');
          return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function isUndoKeyword(note) {
          const norm = String(note || '').trim().toLowerCase();
          return norm === 'حذف' || norm === 'delete' || norm === 'supprimer' || norm === 'sil';
        }

        function evaluateMathExpression(expr) {
          const sanitized = String(expr || '')
            .replace(/×/g, '*')
            .replace(/÷/g, '/')
            .replace(/−/g, '-')
            .replace(/\s+/g, '');
          if (!sanitized || !/^[0-9+\-*/.()]+$/.test(sanitized)) return null;
          const cleaned = sanitized.replace(/[+\-*/.]+$/, '');
          if (!cleaned) return null;

          let pos = 0;
          function parseExpr() {
            let val = parseTerm();
            while (pos < cleaned.length && (cleaned[pos] === '+' || cleaned[pos] === '-')) {
              const op = cleaned[pos++];
              const r = parseTerm();
              val = op === '+' ? val + r : val - r;
            }
            return val;
          }
          function parseTerm() {
            let val = parseFactor();
            while (pos < cleaned.length && (cleaned[pos] === '*' || cleaned[pos] === '/')) {
              const op = cleaned[pos++];
              const r = parseFactor();
              if (op === '/') {
                if (r === 0) return NaN;
                val /= r;
              } else {
                val *= r;
              }
            }
            return val;
          }
          function parseFactor() {
            if (cleaned[pos] === '+') { pos++; return parseFactor(); }
            if (cleaned[pos] === '-') { pos++; return -parseFactor(); }
            const start = pos;
            while (pos < cleaned.length && /[0-9.]/.test(cleaned[pos])) pos++;
            if (start === pos) return NaN;
            return parseFloat(cleaned.slice(start, pos));
          }

          const res = parseExpr();
          if (pos !== cleaned.length || !isFinite(res)) return null;
          return Math.round(res * 100) / 100;
        }

        function parseVCardContact(vcfText) {
          const lines = String(vcfText || '').split(/\r?\n/);
          let name = '';
          let phone = '';
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!name && /^FN[;:]/i.test(line)) {
              const idx = line.indexOf(':');
              if (idx !== -1) name = line.slice(idx + 1).trim();
            } else if (!phone && /^TEL[;:]/i.test(line)) {
              const idx = line.indexOf(':');
              if (idx !== -1) phone = line.slice(idx + 1).trim();
            }
            if (name && phone) break;
          }
          if (!name && !phone) return null;
          return { name: name, phone: phone };
        }

        function buildWhatsAppHref(phone, message) {
          const clean = String(phone || '').replace(/[^\d]/g, '');
          const enc = encodeURIComponent(message);
          return clean ? 'https://wa.me/' + clean + '?text=' + enc : 'https://wa.me/?text=' + enc;
        }

        function buildStatementMessage(summary, txs) {
          const tr = t();
          const store = state.settings.storeName.trim();
          const status = summary.balance > 0 ? tr.owesYouStatus : summary.balance < 0 ? tr.youOweStatus : tr.settledStatus;
          const lines = [];
          if (store) lines.push('*' + store + '*');
          lines.push('*' + tr.waStatementTitle + '*');
          lines.push('━━━━━━━━━━━━━━');
          lines.push(tr.waCustomerLabel + ': *' + summary.name + '*');
          lines.push(tr.waStatusLabel + ': ' + status);
          lines.push(tr.waBalanceLabel + ': *' + formatCurrency(summary.balance) + '*');
          const recent = txs.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 8);
          if (recent.length > 0) {
            lines.push('');
            lines.push('*' + tr.waRecentOps + ':*');
            recent.forEach((tx) => {
              const sign = tx.type === 'given' ? '🔴 +' : '🟢 -';
              const lbl = tx.type === 'given' ? tr.givenTag : tr.takenTag;
              const notePart = tx.note ? ' (' + tx.note + ')' : '';
              lines.push(sign + formatCurrency(tx.amount) + ' [' + lbl + '] · ' + formatDateTimeDisplay(tx.date) + notePart);
            });
          }
          return lines.join('\n');
        }

        function buildReminderMessage(customerName, balance) {
          const store = state.settings.storeName.trim();
          const body = state.settings.reminderTemplate
            .replace(/\{name\}/g, customerName)
            .replace(/\{balance\}/g, formatCurrency(Math.abs(balance)));
          return store ? '*' + store + '*\n' + body : body;
        }

        function buildGmailComposeHref(to, subject, body) {
          const q = new URLSearchParams({
            view: 'cm',
            fs: '1',
            to: String(to || '').trim(),
            su: subject,
            body: body,
          });
          return 'https://mail.google.com/mail/?' + q.toString();
        }

        function compressLogoImage(file, maxSize) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                canvas.width = Math.max(1, Math.round(img.width * scale));
                canvas.height = Math.max(1, Math.round(img.height * scale));
                const ctx = canvas.getContext('2d');
                if (!ctx) { resolve(reader.result); return; }
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/webp', 0.86));
              };
              img.onerror = () => reject(new Error('Invalid image'));
              img.src = reader.result;
            };
            reader.onerror = () => reject(new Error('Read error'));
            reader.readAsDataURL(file);
          });
        }

        // ============================================================
        // 5. DERIVED DATA
        // ============================================================
        function computeData() {
          const txByCust = new Map();
          let totalGiven = 0;
          let totalTaken = 0;

          state.transactions.forEach((tx) => {
            if (tx.type === 'given') totalGiven += tx.amount;
            else totalTaken += tx.amount;
            if (!txByCust.has(tx.customerId)) txByCust.set(tx.customerId, []);
            txByCust.get(tx.customerId).push(tx);
          });

          const overdueMs = (state.settings.overdueDays || 7) * 86400000;
          const summaries = state.customers.map((c) => {
            const list = txByCust.get(c.id) || [];
            let g = 0, tk = 0, lastAt = 0;
            list.forEach((tx) => {
              if (tx.type === 'given') g += tx.amount;
              else tk += tx.amount;
              const tm = new Date(tx.date).getTime();
              if (tm > lastAt) lastAt = tm;
            });
            const balance = Math.round((g - tk) * 100) / 100;
            const isOverdue = balance > 0 && lastAt > 0 && (state.nowTick - lastAt >= overdueMs);
            return Object.assign({}, c, {
              totalGiven: Math.round(g * 100) / 100,
              totalTaken: Math.round(tk * 100) / 100,
              balance: balance,
              lastTransactionAt: lastAt,
              transactionCount: list.length,
              isOverdue: isOverdue,
            });
          });

          return {
            summaries: summaries,
            totalGiven: Math.round(totalGiven * 100) / 100,
            totalTaken: Math.round(totalTaken * 100) / 100,
            netBalance: Math.round((totalGiven - totalTaken) * 100) / 100,
          };
        }

        function filterCustomers(summaries) {
          const q = state.searchQuery.trim().toLowerCase();
          const f = state.filters;

          const filtered = summaries.filter((c) => {
            if (q) {
              const mName = c.name.toLowerCase().includes(q);
              const mPhone = (c.phone || '').toLowerCase().includes(q);
              if (!mName && !mPhone) return false;
            }
            if (f.accountType === 'owes_me' && c.balance <= 0) return false;
            if (f.accountType === 'i_owe' && c.balance >= 0) return false;
            if (f.overdueOnly && !c.isOverdue) return false;

            const ref = c.lastTransactionAt || c.createdAt;
            if (f.timeRange === 'last_24h' && state.nowTick - ref > 86400000) return false;
            if (f.timeRange === 'last_week' && state.nowTick - ref > 7 * 86400000) return false;
            if (f.timeRange === 'last_month' && state.nowTick - ref > 30 * 86400000) return false;
            return true;
          });

          return filtered.sort((a, b) => {
            const ta = a.lastTransactionAt || a.createdAt;
            const tb = b.lastTransactionAt || b.createdAt;
            return f.timeRange === 'oldest' ? ta - tb : tb - ta;
          });
        }

        function isBackupReminderDue() {
          if (state.customers.length === 0 && state.transactions.length === 0) return false;
          if (state.settings.reminderDismissedUntil && state.nowTick < state.settings.reminderDismissedUntil) return false;
          let oldest = state.nowTick;
          state.customers.forEach((c) => { if (c.createdAt < oldest) oldest = c.createdAt; });
          const base = state.settings.lastBackupAt || oldest;
          return (state.nowTick - base) >= TWELVE_HOURS_MS;
        }

        // ============================================================
        // 7. TOAST & DIALOGS
        // ============================================================
        function showToast(msg) {
          const root = document.getElementById('toast-root');
          root.innerHTML = '<div class="toast" role="status" aria-live="polite">' + escapeHtml(msg) + '</div>';
          if (state.toastTimer) clearTimeout(state.toastTimer);
          state.toastTimer = setTimeout(() => { root.innerHTML = ''; }, 3200);
        }

        function closeModal() {
          document.getElementById('modal-root').innerHTML = '';
        }

        function closePermModal() {
          const permRoot = document.getElementById('perm-modal-root');
          if (permRoot) permRoot.innerHTML = '';
        }

            '<div class="modal-backdrop center" id="contacts-perm-backdrop" style="z-index:55;">' +
              '<div class="modal-dialog" role="dialog" aria-modal="true">' +
                '<div style="display:flex;align-items:flex-start;gap:12px;">' +

                    ICONS.contacts +
                  '</div>' +
                  '<div style="min-width:0;">' +
                    '<h3 style="margin:0;font-size:16px;font-weight:800;">' + escapeHtml(tr.contactsPermTitle) + '</h3>' +
                    '<p style="margin:6px 0 0;font-size:13px;color:var(--text-secondary);line-height:1.6;">' + escapeHtml(tr.contactsPermDesc) + '</p>' +
                    '<p style="margin:8px 0 0;font-size:11px;color:var(--text-muted);line-height:1.5;">' + escapeHtml(tr.contactsPermPrivacy) + '</p>' +
                  '</div>' +
                '</div>' +
                '<div style="display:flex;justify-content:flex-end;gap:10px;padding-top:8px;flex-wrap:wrap;">' +
                  '<button type="button" class="btn btn-sm btn-secondary" id="contacts-perm-deny">' + escapeHtml(tr.contactsPermDenyBtn) + '</button>' +
                  '<button type="button" class="btn btn-sm btn-emerald" id="contacts-perm-allow">' + ICONS.check + '<span>' + escapeHtml(tr.contactsPermAllowBtn) + '</span></button>' +
                '</div>' +
              '</div>' +
            '</div>';

          document.getElementById('contacts-perm-backdrop').addEventListener('click', (e) => {
            if (e.target.id === 'contacts-perm-backdrop') closePermModal();
          });
          document.getElementById('contacts-perm-deny').addEventListener('click', () => {
            state.settings.contactsPermission = 'denied';

          });
          document.getElementById('contacts-perm-allow').addEventListener('click', () => {
            state.settings.contactsPermission = 'granted';
            persistSettings();
            syncBrowserContactsPermission();
            closePermModal();
            showToast(tr.contactsPermGrantedToast);
            // Invoke onAllow synchronously inside user click gesture so Chrome Android shows system Contacts permission
            if (opts && typeof opts.onAllow === 'function') opts.onAllow();

        function openCustomerModal(editingCustomer) {
          const tr = t();
          const modalRoot = document.getElementById('modal-root');

          let currentPhone = editingCustomer ? editingCustomer.phone : '';

          modalRoot.innerHTML =

                '</div>' +
                '<form id="cust-form" style="display:flex;flex-direction:column;gap:14px;">' +
                  '<div>' +
                    '<label for="cust-name" class="filter-label">' + escapeHtml(tr.customerNameLabel) + '</label>' +
                    '<input id="cust-name" type="text" class="text-input" value="' + escapeHtml(currentName) + '" placeholder="' + escapeHtml(tr.customerNamePlaceholder) + '" />' +
                    '<p id="cust-name-err" class="hidden" style="margin:6px 0 0;font-size:12px;font-weight:700;color:var(--accent-rose);"></p>' +
                  '</div>' +
                  '<div>' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
                      '<label for="cust-phone" class="filter-label" style="margin:0;">' + escapeHtml(tr.phoneLabel) + '</label>' +
                      '<span class="font-num" style="font-size:11px;color:var(--text-muted);" dir="ltr">' + escapeHtml(state.settings.defaultCountryCode) + '</span>' +
                    '</div>' +
                    '<input id="cust-phone" type="tel" dir="ltr" class="text-input font-num" value="' + escapeHtml(currentPhone) + '" placeholder="' + escapeHtml(tr.phonePlaceholder) + '" />' +
                    '<div style="display:flex;gap:8px;margin-top:8px;">' +
                      '<button type="button" id="pick-contacts-btn" class="btn btn-sm btn-secondary" style="flex:1;">' + ICONS.contacts + '<span>' + escapeHtml(tr.pickFromContacts) + '</span></button>' +
                      '<input type="file" id="vcf-file-input" accept=".vcf,text/vcard,text/x-vcard" class="hidden" />' +
                      '<button type="button" id="pick-vcf-btn" class="btn btn-sm btn-outline">.vcf</button>' +
                    '</div>' +
                    '<p id="cust-contact-hint" class="hidden" style="margin:6px 0 0;font-size:11px;color:var(--tint-amber-text);line-height:1.5;"></p>' +
                    '<div id="cust-multi-phones" class="hidden" style="margin-top:8px;display:flex;flex-direction:column;gap:6px;"></div>' +
                    '<p id="cust-phone-preview" class="hidden" style="margin:6px 0 0;font-size:12px;color:var(--text-muted);"></p>' +
                  '</div>' +
                  '<div style="display:flex;gap:10px;padding-top:6px;">' +
                    '<button type="button" class="btn btn-secondary" id="cust-cancel" style="flex:1;">' + escapeHtml(tr.cancel) + '</button>' +
                    '<button type="submit" class="btn btn-primary" style="flex:2;">' + escapeHtml(tr.save) + '</button>' +
                  '</div>' +
                '</form>' +
              '</div>' +
            '</div>';

          const nameInput = document.getElementById('cust-name');
          const phoneInput = document.getElementById('cust-phone');
          const errEl = document.getElementById('cust-name-err');
          const hintEl = document.getElementById('cust-contact-hint');
          const multiPhonesEl = document.getElementById('cust-multi-phones');
          const previewEl = document.getElementById('cust-phone-preview');
          const vcfInput = document.getElementById('vcf-file-input');

          function refreshPreview() {
            const val = phoneInput.value.trim();
            if (!val) { previewEl.classList.add('hidden'); return; }
            const formatted = formatPhoneWithCountryCode(val, state.settings.defaultCountryCode);
            previewEl.innerHTML = escapeHtml(tr.countryCodeHint) + ' <strong class="font-num" dir="ltr">' + escapeHtml(formatted) + '</strong>';
            previewEl.classList.remove('hidden');
          }
          refreshPreview();
          setTimeout(() => nameInput.focus(), 30);

          document.getElementById('cust-modal-backdrop').addEventListener('click', (e) => {
            if (e.target.id === 'cust-modal-backdrop') closeModal();
          });
          document.getElementById('cust-modal-close').addEventListener('click', closeModal);
          document.getElementById('cust-cancel').addEventListener('click', closeModal);

          phoneInput.addEventListener('input', refreshPreview);
          phoneInput.addEventListener('blur', () => {
            if (phoneInput.value.trim()) {
              phoneInput.value = formatPhoneWithCountryCode(phoneInput.value, state.settings.defaultCountryCode);
              refreshPreview();
            }
          });

          function applyPicked(picked) {
            multiPhonesEl.classList.add('hidden');
            multiPhonesEl.innerHTML = '';
            const phones = Array.isArray(picked && picked.phones)
              ? picked.phones.filter((p) => String(p || '').trim())
              : (picked && picked.phone && picked.phone.trim() ? [picked.phone.trim()] : []);

            if (phones.length === 0) {
              hintEl.textContent = tr.contactNoPhoneError;
              hintEl.classList.remove('hidden');
              return;
            }
            if (!nameInput.value.trim() && picked && picked.name) {
              nameInput.value = picked.name;
            }
            phoneInput.value = formatPhoneWithCountryCode(phones[0], state.settings.defaultCountryCode);
            hintEl.classList.add('hidden');
            refreshPreview();

            if (phones.length > 1) {
              multiPhonesEl.innerHTML =
                '<span class="filter-label" style="margin:0;">' + escapeHtml(tr.choosePhoneNumberLabel) + '</span>' +
                '<div class="chip-wrap" dir="ltr">' +
                  phones.map((ph) => '<button type="button" class="chip-btn font-num" data-picked-tel="' + escapeHtml(ph) + '">' + escapeHtml(ph) + '</button>').join('') +
                '</div>';
              multiPhonesEl.classList.remove('hidden');
              multiPhonesEl.querySelectorAll('[data-picked-tel]').forEach((btn) => {
                btn.addEventListener('click', () => {
                  phoneInput.value = formatPhoneWithCountryCode(btn.getAttribute('data-picked-tel'), state.settings.defaultCountryCode);
                  refreshPreview();
                });
              });
            }
          }

          function launchNativeContactsPicker() {
            if (hasNativeContactsPicker()) {
              // Call select() synchronously inside user gesture for Chrome Android permission prompt
              navigator.contacts.select(pwa.supportedContactProps, { multiple: false })
                .then((res) => {
                  if (!res || res.length === 0) return;
                  const c = res[0];
                  const cName = Array.isArray(c.name) ? (c.name[0] || '') : '';
                  const cPhones = Array.isArray(c.tel) ? c.tel : [];
                  applyPicked({ name: cName, phones: cPhones });
                })
                .catch((err) => {
                  if (err && err.name === 'AbortError') return;
                  if (err && err.name === 'SecurityError') {
                    state.settings.contactsPermission = 'denied';
                    persistSettings();
                  }
                  hintEl.textContent = err && err.name === 'SecurityError'
                    ? tr.contactsBlockedHint
                    : tr.contactsUnsupportedHint;
                  hintEl.classList.remove('hidden');
                  vcfInput.click();
                });
              return;
            }

            hintEl.textContent = tr.contactsUnsupportedHint;
            hintEl.classList.remove('hidden');
            vcfInput.click();
          }

          document.getElementById('pick-contacts-btn').addEventListener('click', () => {
            hintEl.classList.add('hidden');
            if (getEffectiveContactsPermission() !== 'granted') {
              openContactsPermissionDialog({
                onAllow: launchNativeContactsPicker,
              });
              return;
            }
            launchNativeContactsPicker();
          });

          document.getElementById('pick-vcf-btn').addEventListener('click', () => vcfInput.click());
          vcfInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              const parsed = parseVCardContact(String(reader.result || ''));
              applyPicked(parsed);
            };
            reader.readAsText(file);
            e.target.value = '';
          });

          document.getElementById('cust-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const cleanName = nameInput.value.trim();
            if (!cleanName) {
              errEl.textContent = tr.nameRequiredError;
              errEl.classList.remove('hidden');
              return;
            }
            const cleanPhone = phoneInput.value.trim()
              ? formatPhoneWithCountryCode(phoneInput.value, state.settings.defaultCountryCode)
              : '';
            const now = Date.now();
            if (editingCustomer) {
              state.customers = state.customers.map((c) =>
                c.id === editingCustomer.id ? Object.assign({}, c, { name: cleanName, phone: cleanPhone, updatedAt: now }) : c
              );
              showToast(tr.customerUpdated);
            } else {
              state.customers.unshift({
                id: generateId(),
                name: cleanName,
                phone: cleanPhone,
                createdAt: now,
                updatedAt: now,
              });
              showToast(tr.customerAdded);
            }
            persistCustomers();
            closeModal();
            render();
          });
        }

        // ============================================================
        // 8. BACKUP & RESTORE ACTIONS
        // ============================================================
        function createBackupPayload() {
          return {
            version: 1,
            exportedAt: new Date().toISOString(),
            customers: state.customers,
            transactions: state.transactions,
            settings: state.settings,
          };
        }

        function exportBackupFile() {
          const payload = createBackupPayload();
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'daftar-hisabat-backup-' + new Date().toISOString().slice(0, 10) + '.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          state.settings.lastBackupAt = Date.now();
          state.settings.reminderDismissedUntil = null;
          persistSettings();
          showToast(t().backupSuccess);
          render();
        }

        async function shareBackupFile() {
          const payload = createBackupPayload();
          const json = JSON.stringify(payload, null, 2);
          const file = new File([json], 'daftar-hisabat-backup-' + new Date().toISOString().slice(0, 10) + '.json', { type: 'application/json' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ files: [file], title: t().appName });
              state.settings.lastBackupAt = Date.now();
              state.settings.reminderDismissedUntil = null;
              persistSettings();
              showToast(t().backupSuccess);
              render();
              return;
            } catch (_) {
              return;
            }
          }
          exportBackupFile();
        }

          else root.classList.remove('dark');

          if (themeMeta) {
            themeMeta.setAttribute('content', state.settings.darkMode ? '#020617' : '#0f172a');
          }
        }

        function bindProfileEvents(data) {
          const tr = t();
          const customer = data.summaries.find((c) => c.id === state.selectedCustomerId);
          if (!customer) return;

          document.getElementById('profile-back-btn').addEventListener('click', () => { state.activeView = 'home'; render(); });
          document.getElementById('profile-edit-btn').addEventListener('click', () => openCustomerModal(customer));
          document.getElementById('profile-del-btn').addEventListener('click', () => {
            openConfirmDialog({
              title: tr.deleteCustomerTitle,
              description: tr.deleteCustomerConfirm,
              confirmLabel: tr.delete,
              onConfirm: () => {
                state.customers = state.customers.filter((c) => c.id !== customer.id);
                state.transactions = state.transactions.filter((tx) => tx.customerId !== customer.id);
                persistCustomers();
                persistTransactions();
                state.selectedCustomerId = null;
                state.activeView = 'home';
                showToast(tr.customerDeleted);
                render();
              },
            });
          });

          document.getElementById('open-calc-given').addEventListener('click', () => {
            state.calc = { type: 'given', expression: '', note: '', dateTime: toLocalDateTimeInput(), error: '' };
            state.activeView = 'calculator';
            render();
          });
          document.getElementById('open-calc-taken').addEventListener('click', () => {
            state.calc = { type: 'taken', expression: '', note: '', dateTime: toLocalDateTimeInput(), error: '' };
            state.activeView = 'calculator';
            render();
          });

          document.getElementById('copy-stmt-btn').addEventListener('click', async () => {
            const txs = state.transactions.filter((tx) => tx.customerId === customer.id);
            const msg = buildStatementMessage(customer, txs);
            try {
              await navigator.clipboard.writeText(msg);
              showToast(tr.statementCopied);
            } catch (_) {}
          });

          // Long-press & right-click delete on transaction cards
          document.querySelectorAll('[data-tx-id]').forEach((card) => {
            const txId = card.getAttribute('data-tx-id');
            let pressTimer = null;

            function requestDelete() {
              openConfirmDialog({
                title: tr.deleteTransactionTitle,
                description: tr.deleteTransactionConfirm,
                confirmLabel: tr.delete,
                onConfirm: () => {
                  state.transactions = state.transactions.filter((tx) => tx.id !== txId);
                  persistTransactions();
                  showToast(tr.transactionDeleted);
                  render();
                },
              });
            }

            function startPress() {
              clearPress();
              card.classList.add('pressing');
              pressTimer = setTimeout(() => {
                card.classList.remove('pressing');
                if (navigator.vibrate) navigator.vibrate(25);
                requestDelete();
              }, 550);
            }

            function clearPress() {
              if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
              card.classList.remove('pressing');
            }

            card.addEventListener('mousedown', startPress);
            card.addEventListener('mouseup', clearPress);
            card.addEventListener('mouseleave', clearPress);
            card.addEventListener('touchstart', startPress, { passive: true });
            card.addEventListener('touchend', clearPress);
            card.addEventListener('touchmove', clearPress);
            card.addEventListener('contextmenu', (e) => {
              e.preventDefault();
              requestDelete();
            });
          });
        }

        function bindCalculatorEvents() {
          const tr = t();
          const customerId = state.selectedCustomerId;

          function updateCalcDisplayOnly() {
            const exprEl = document.getElementById('calc-expr-text');
            const resEl = document.getElementById('calc-result-text');
            const errEl = document.getElementById('calc-err-text');
            if (exprEl) exprEl.textContent = state.calc.expression || '0';
            const val = evaluateMathExpression(state.calc.expression);
            if (resEl) resEl.textContent = val !== null ? formatCurrency(val) : '0';
            if (errEl) {
              if (state.calc.error) {
                errEl.textContent = state.calc.error;
                errEl.classList.remove('hidden');
              } else {
                errEl.classList.add('hidden');
              }
            }
          }

          function appendToken(token) {
            state.calc.error = '';
            const ops = ['+', '−', '×', '÷'];
            const prev = state.calc.expression;
            const last = prev.slice(-1);
            if (ops.includes(token)) {
              if (!prev) return;
              state.calc.expression = ops.includes(last) ? prev.slice(0, -1) + token : prev + token;
            } else if (token === '.') {
              const seg = prev.split(/[+−×÷]/).pop() || '';
              if (seg.includes('.')) return;
              state.calc.expression = prev ? prev + '.' : '0.';
            } else {
              state.calc.expression = prev === '0' ? token : prev + token;
            }
            updateCalcDisplayOnly();
          }

          function executeUndoLast() {
            const custTxs = state.transactions
              .filter((tx) => tx.customerId === customerId)
              .sort((a, b) => b.createdAt - a.createdAt);
            if (custTxs.length === 0) {
              showToast(tr.smartUndoEmpty);
              return;
            }
            const lastId = custTxs[0].id;
            state.transactions = state.transactions.filter((tx) => tx.id !== lastId);
            persistTransactions();
            state.activeView = 'profile';
            showToast(tr.smartUndoDone);
            render();
          }

          document.getElementById('calc-back-btn').addEventListener('click', () => { state.activeView = 'profile'; render(); });
          document.getElementById('calc-type-given').addEventListener('click', () => { state.calc.type = 'given'; render(); });
          document.getElementById('calc-type-taken').addEventListener('click', () => { state.calc.type = 'taken'; render(); });
          document.getElementById('calc-clear-btn').addEventListener('click', () => { state.calc.expression = ''; state.calc.error = ''; updateCalcDisplayOnly(); });
          document.getElementById('calc-bksp-btn').addEventListener('click', () => { state.calc.expression = state.calc.expression.slice(0, -1); state.calc.error = ''; updateCalcDisplayOnly(); });

          document.querySelectorAll('[data-calc-key]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const k = btn.getAttribute('data-calc-key');
              if (k === '=') {
                const v = evaluateMathExpression(state.calc.expression);
                if (v !== null && v >= 0) {
                  state.calc.expression = String(v);
                  updateCalcDisplayOnly();
                }
              } else {
                appendToken(k);
              }
            });
          });

          const noteEl = document.getElementById('calc-note-input');
          noteEl.addEventListener('input', (e) => {
            const cursor = e.target.selectionStart;
            state.calc.note = e.target.value;
            render();
            const nextNote = document.getElementById('calc-note-input');
            if (nextNote) {
              nextNote.focus();
              try { nextNote.setSelectionRange(cursor, cursor); } catch (_) {}
            }
          });

          document.getElementById('calc-date-input').addEventListener('change', (e) => {
            state.calc.dateTime = e.target.value;
          });

          const undoBtn = document.getElementById('smart-undo-btn');
          if (undoBtn) undoBtn.addEventListener('click', executeUndoLast);

          document.getElementById('calc-confirm-btn').addEventListener('click', () => {
            if (isUndoKeyword(state.calc.note)) {
              executeUndoLast();
              return;
            }
            const amount = evaluateMathExpression(state.calc.expression);
            if (amount === null || amount <= 0) {
              state.calc.error = tr.invalidAmountError;
              updateCalcDisplayOnly();
              return;
            }
            const d = new Date(state.calc.dateTime);
            const iso = isNaN(d.getTime()) ? new Date().toISOString() : d.toISOString();
            const now = Date.now();
            state.transactions.unshift({
              id: generateId(),
              customerId: customerId,
              type: state.calc.type,
              amount: amount,
              note: state.calc.note.trim(),
              date: iso,
              createdAt: now,
            });
            state.customers = state.customers.map((c) => c.id === customerId ? Object.assign({}, c, { updatedAt: now }) : c);
            persistTransactions();
            persistCustomers();
            state.activeView = 'profile';
            showToast(tr.transactionAdded);
            render();
          });
        }

          document.getElementById('gmail-recipient-input').addEventListener('input', (e) => {
            state.settings.backupEmail = e.target.value;
            persistSettings();
            const gmailLink = document.getElementById('send-gmail-link');
            if (gmailLink) {
              gmailLink.href = buildGmailComposeHref(
                state.settings.backupEmail,
                tr.appName + ' - ' + (state.settings.storeName || tr.appName) + ' (' + new Date().toISOString().slice(0, 10) + ')',
                tr.appName + ' (' + (state.settings.storeName || tr.appName) + ')\n' + tr.lastBackupLabel + ' ' + new Date().toLocaleString()
              );
            }
          });

          document.getElementById('export-backup-btn').addEventListener('click', exportBackupFile);
          document.getElementById('share-backup-btn').addEventListener('click', shareBackupFile);
          document.getElementById('send-gmail-link').addEventListener('click', exportBackupFile);

          const restoreInput = document.getElementById('restore-file-input');
          document.getElementById('restore-backup-btn').addEventListener('click', () => restoreInput.click());
          restoreInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const parsed = JSON.parse(String(reader.result || ''));
                if (!parsed || !Array.isArray(parsed.customers) || !Array.isArray(parsed.transactions)) {
                  showToast(tr.restoreInvalidError);
                  return;
                }
                openConfirmDialog({
                  title: tr.restoreConfirmTitle,
                  description: tr.restoreConfirmDesc,
                  confirmLabel: tr.confirm,
                  destructive: false,
                  onConfirm: () => {
                    state.customers = parsed.customers.filter((c) => c && typeof c.id === 'string' && typeof c.name === 'string');
                    state.transactions = parsed.transactions.filter((tx) => tx && typeof tx.id === 'string' && typeof tx.customerId === 'string' && typeof tx.amount === 'number');
                    if (parsed.settings && typeof parsed.settings === 'object') {
                      state.settings = Object.assign({}, state.settings, parsed.settings);
                    }
                    persistCustomers();
                    persistTransactions();
                    persistSettings();
                    state.activeView = 'home';
                    showToast(tr.restoreSuccess);
                    render();
                  },
                });
              } catch (_) {
                showToast(tr.restoreInvalidError);
              }
            };
            reader.readAsText(file);
            e.target.value = '';
          });

          const settingsInstallBtn = document.getElementById('settings-install-btn');
          if (settingsInstallBtn) settingsInstallBtn.addEventListener('click', triggerPWAInstall);

          const reqContactsPermBtn = document.getElementById('request-contacts-perm-btn');
          if (reqContactsPermBtn) {
            reqContactsPermBtn.addEventListener('click', () => {
              openContactsPermissionDialog({
                onAllow: () => {
                  if (hasNativeContactsPicker()) {
                    navigator.contacts.select(pwa.supportedContactProps, { multiple: false })
                      .catch((err) => {
                        if (err && err.name === 'SecurityError') {
                          state.settings.contactsPermission = 'denied';
                          persistSettings();
                          showToast(tr.contactsPermDeniedToast);
                        }
                      })
                      .finally(() => render());
                    return;
                  }
                  render();
                },
                onDeny: () => render(),
              });
            });
          }

          const revokeContactsPermBtn = document.getElementById('revoke-contacts-perm-btn');
          if (revokeContactsPermBtn) {
            revokeContactsPermBtn.addEventListener('click', () => {
              state.settings.contactsPermission = 'prompt';
              persistSettings();
              showToast(tr.contactsPermRevokedToast);
              render();
            });
          }
        }

        function render() {
          syncDocumentThemeAndLang();
          const data = computeData();
          const root = document.getElementById('app');

          if (state.activeView === 'home') {
            root.innerHTML = renderHomeView(data);
            bindHomeEvents();
          } else if (state.activeView === 'profile') {
            root.innerHTML = renderProfileView(data);
            if (state.activeView === 'profile') bindProfileEvents(data);
            else bindHomeEvents();
          } else if (state.activeView === 'calculator') {
            root.innerHTML = renderCalculatorView(data);
            if (state.activeView === 'calculator') bindCalculatorEvents();
            else bindHomeEvents();
          } else if (state.activeView === 'settings') {
            root.innerHTML = renderSettingsView();
            bindSettingsEvents();
          }
        }

        // Keyboard support for desktop calculator view
        window.addEventListener('keydown', (e) => {
          if (state.activeView !== 'calculator') return;
          const tag = e.target && e.target.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA') return;
          const map = { '*': '×', '/': '÷', '-': '−', '+': '+', '.': '.' };
          if (/^[0-9]$/.test(e.key)) {
            const btn = document.querySelector('[data-calc-key="' + e.key + '"]');
            if (btn) btn.click();
          } else if (map[e.key]) {
            if (e.key === '/') e.preventDefault();
            const btn = document.querySelector('[data-calc-key="' + map[e.key] + '"]');
            if (btn) btn.click();
          } else if (e.key === 'Enter' || e.key === '=') {
            e.preventDefault();
            const btn = document.querySelector('[data-calc-key="="]');
            if (btn) btn.click();
          } else if (e.key === 'Backspace') {
            const btn = document.getElementById('calc-bksp-btn');
            if (btn) btn.click();
          } else if (e.key === 'Escape') {
            const btn = document.getElementById('calc-clear-btn');
            if (btn) btn.click();
          }
        });

        setInterval(() => {
          state.nowTick = Date.now();
          if (state.activeView === 'home') render();
        }, 60000);

        // PWA Install Prompt, Connectivity & Service Worker Registration
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          pwa.deferredPrompt = e;
          render();
        });

        window.addEventListener('appinstalled', () => {
          pwa.isInstalled = true;
          pwa.deferredPrompt = null;
          render();
        });

        window.addEventListener('online', () => { pwa.isOnline = true; render(); });
        window.addEventListener('offline', () => { pwa.isOnline = false; render(); });

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        }

        render();
      })();
    </script>
  </body>
</html>
