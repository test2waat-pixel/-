      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Ledger Book Shape -->
  <rect x="128" y="104" width="256" height="304" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#334155" stroke-width="10" />
  <rect x="156" y="104" width="228" height="304" rx="24" fill="#f8fafc" />
  <!-- Spine Accent -->
  <rect x="128" y="104" width="42" height="304" rx="14" fill="url(#accent)" />
  <!-- Ledger Lines -->
  <rect x="206" y="164" width="136" height="20" rx="10" fill="#0f172a" />
  <rect x="206" y="216" width="104" height="16" rx="8" fill="#64748b" />
  <!-- Debit (Rose) & Credit (Emerald) Balance Bars -->
  <rect x="206" y="274" width="60" height="24" rx="12" fill="#e11d48" />
  <rect x="280" y="274" width="62" height="24" rx="12" fill="#10b981" />
